<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atif Aslam</title>
  <style>
    body {
        background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0,0, 0, 0.5)), url("bg.atif.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed ;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .page-container{
        display: flex ;
        gap: 30px;
        width: 100%;
        max-width: 1100px;
    }
    .left-panel{
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 17px;
    }
    .right-panel{
        flex:1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .section-title{
        color: darkgoldenrod;
        font-size: 2.2rem;
        font-weight: 1000;
        letter-spacing: 1px;
    
    }
    .song-card{
        display: block;
        background-color: blue;
        border-radius: 18px;
        padding: 20px 25px;
        color: goldenrod;
        text-decoration: none;
    }
    .song-card:hover{
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(0,0,0, 0.25);
        background-color: hsl(240, 100%, 42%);   
     }
    .song-title{
        font-size: 1.3rem;
        font-weight: bold;
        margin: 0 0 5px 0;
    }
    .circle-avatar{
        width: 250px;
        height: 250px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 8px 16px rgba(0,0,0, 0.3);
        margin-bottom: 20px;
    }
    .artist-name{
        color: goldenrod;
        font-size: 2rem;
        font-weight:bold;
        margin:0;
        text-shadow: 2px 2px 4px rgba(0,0,0, 0.4);
    }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="left-panel">

        <h2 class="section-title">BEST OF ATIF</h2>

        <a href="https://youtu.be/jlwt4IW0f8c?si=xcPuUTMjHi1w7_hl" target="_blank" class="song-card">
          <h3 class="song-title">HONA THA PYAAR</h3>
         </a>

        <a href="https://youtu.be/6tFM-QTzmxU?si=pLnref6hqaeM0a55" target="_blank" class="song-card">
            <h3 class="song-title">O MERI LAILA</h3>
        </a>

        <a href="https://youtu.be/OVVZ6lyHV-Y?si=KQTRPEN3pCxgR7Yh" target="_blank" class="song-card">
            <h3 class="song-title">TERA HONE LAGA HUN</h3>
        </a>
        <a href="https://youtu.be/tLkyWp8nzrY?si=vAu2kcVgABsBIrjK" target="_blank" class="song-card">
            <h3 class="song-title">JEENA JEENA </h3>
        </a>
        <a href="https://youtu.be/oQaWXlsSW2c?si=t0Jw73S03J3YAxQE" target="_blank" class="song-card">
            <h3 class="song-title">TERE LIYE</h3>
        </a>
        </div>

        <div class="right-panel">
            <img src="atif.jpg" class="circle-avatar" >
            <h1 class="artist-name">ATIF ASLAM</h1>
            </div>
        
    </div>
